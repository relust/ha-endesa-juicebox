; Configuration for dbus-mqtt-ev-charger on Victron Cerbo GX
; Copy to /data/etc/dbus-mqtt-ev-charger/config.ini

[DEFAULT]
; Logging level: ERROR, WARNING, INFO, DEBUG
logging = INFO

; Device name displayed in Victron GUI
device_name = JuiceBox EV Charger

; Device instance on D-Bus (default 11)
device_instance = 11

; Position: 0 = AC Out, 1 = AC In
position = 0

[MQTT]
; IP of your Home Assistant Mosquitto broker
broker_address = 192.168.0.143
broker_port = 1883

; Credentials if your Mosquitto broker requires authentication
username = homeassistant
password = your_mqtt_password

; Base topic published by the Home Assistant Endesa JuiceBox integration
topic = venus-os/evcharger
